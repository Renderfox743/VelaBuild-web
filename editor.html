<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VelaBuild - Download Projects</title>
    <style>
        :root {
            --primary: #FF6B35;
            --bg-dark: #0A0A0F;
            --bg-card: #14141F;
            --bg-input: #1A1A2E;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0B8;
            --text-muted: #6B6B80;
            --border: #2A2A3E;
            --success: #4CAF50;
            --error: #f44336;
            --gradient: linear-gradient(135deg, #FF6B35 0%, #FF8F65 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }

        .logo span {
            color: var(--text-primary);
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .project-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .project-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .project-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .download-options {
            display: grid;
            gap: 0.5rem;
        }

        .btn-download {
            padding: 0.5rem;
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            text-align: left;
        }

        .btn-download:hover {
            background: var(--bg-card);
            color: var(--primary);
            border-color: var(--primary);
        }

        .toast {
            position: fixed;
            top: 70px;
            right: 20px;
            padding: 1rem;
            border-radius: 8px;
            color: white;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        .toast-success { background: var(--success); }
        .toast-error { background: var(--error); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">Vela<span>Build</span></a>
        <div class="nav-actions">
            <a href="editor.html" class="btn btn-primary">+ New Project</a>
            <a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <h1>Download Projects</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Download your built projects and source code</p>

        <input type="text" class="search-input" id="searchInput" placeholder="Search projects...">

        <div class="projects-grid" id="projectsList">
            <div style="text-align: center; padding: 3rem; grid-column: 1/-1;">
                <div class="spinner"></div>
                <p style="margin-top: 1rem; color: var(--text-secondary);">Loading projects...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://rdfxvelaapi.share.zrok.io';
        let session = null;
        let currentPassword = null;
        let allProjects = [];

        document.addEventListener('DOMContentLoaded', () => {
            const sessionData = localStorage.getItem('velabuild_session');
            if (!sessionData) {
                window.location.href = 'index.html';
                return;
            }
            
            session = JSON.parse(sessionData);
            
            if (session.password) {
                currentPassword = session.password;
                loadProjects();
            } else {
                promptPassword();
            }
        });

        async function apiRequest(endpoint, data) {
            const url = `${API_URL}${endpoint}`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                return await response.json();
            } catch (error) {
                return { success: false, error: 'Network error', log: error.message };
            }
        }

        function promptPassword() {
            const password = prompt('Enter your password to load projects:');
            if (password) {
                currentPassword = password;
                session.password = password;
                localStorage.setItem('velabuild_session', JSON.stringify(session));
                loadProjects();
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        async function loadProjects() {
            const result = await apiRequest('/list', {
                username: session.username,
                password: currentPassword
            });
            
            if (result.success && result.projects) {
                allProjects = result.projects;
                displayProjects(allProjects);
            } else {
                document.getElementById('projectsList').innerHTML = `
                    <div style="text-align: center; padding: 3rem; grid-column: 1/-1;">
                        <p style="color: var(--error); margin-bottom: 1rem;">${result.error || 'Failed to load projects'}</p>
                        <button class="btn btn-primary" onclick="loadProjects()">Retry</button>
                    </div>
                `;
            }
        }

        function displayProjects(projects) {
            const projectsList = document.getElementById('projectsList');
            
            if (projects.length === 0) {
                projectsList.innerHTML = `
                    <div style="text-align: center; padding: 3rem; grid-column: 1/-1;">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
                        <h3>No Projects Available</h3>
                        <p style="color: var(--text-secondary); margin-bottom: 1rem;">Deploy a project first</p>
                        <a href="editor.html" class="btn btn-primary">Create Project</a>
                    </div>
                `;
                return;
            }
            
            projectsList.innerHTML = projects.map(project => `
                <div class="project-card" data-name="${project.name.toLowerCase()}">
                    <div class="project-name">📁 ${project.name}</div>
                    <div class="project-info">
                        ${project.hasRpk ? '📦 RPK available' : 'No RPK'} · 
                        ${project.hasSource ? '📄 Source available' : 'No source'}
                    </div>
                    <div class="download-options">
                        ${project.hasRpk ? `<button class="btn-download" onclick="downloadProject('${project.name}', 'rpk')">📦 Download RPK</button>` : ''}
                        ${project.hasSource ? `<button class="btn-download" onclick="downloadProject('${project.name}', 'source')">📄 Download Source</button>` : ''}
                        <button class="btn-download" onclick="downloadProject('${project.name}', 'certs')">🔐 Download Certificates</button>
                        <button class="btn-download" onclick="downloadProject('${project.name}', 'startcode')">📁 Download Start Code</button>
                    </div>
                </div>
            `).join('');
        }

        async function downloadProject(projectName, what) {
            showToast('⬇️ Downloading...', 'success');
            
            const result = await apiRequest('/download', {
                username: session.username,
                password: currentPassword,
                project: projectName,
                what: what
            });
            
            if (result.success && result.files) {
                // Download each file
                for (const [filePath, base64Content] of Object.entries(result.files)) {
                    const blob = base64ToBlob(base64Content);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filePath.split('/').pop();
                    a.click();
                    URL.revokeObjectURL(url);
                }
                showToast('✅ Download complete!', 'success');
            } else {
                showToast('❌ ' + (result.error || 'Download failed'), 'error');
            }
        }

        function base64ToBlob(base64) {
            const byteCharacters = atob(base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            return new Blob([byteArray]);
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Search functionality
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.toLowerCase();
                    const filtered = allProjects.filter(p => 
                        p.name.toLowerCase().includes(searchTerm)
                    );
                    displayProjects(filtered);
                });
            }
        });
    </script>
</body>
</html>
