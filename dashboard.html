<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VelaBuild - Dashboard</title>
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --bg-dark: #0A0A0F;
            --bg-card: #14141F;
            --bg-input: #1A1A2E;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0B8;
            --text-muted: #6B6B80;
            --border: #2A2A3E;
            --success: #4CAF50;
            --error: #f44336;
            --warning: #FFC107;
            --gradient: linear-gradient(135deg, #FF6B35 0%, #FF8F65 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }

        .logo span {
            color: var(--text-primary);
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .welcome-text {
            color: var(--text-secondary);
        }

        .welcome-text span {
            color: var(--primary);
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .project-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .project-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .project-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .project-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .project-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            top: 70px;
            right: 20px;
            padding: 1rem;
            border-radius: 8px;
            color: white;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .toast-success { background: var(--success); }
        .toast-error { background: var(--error); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">Vela<span>Build</span></a>
        <div class="nav-actions">
            <span class="welcome-text">Welcome, <span id="username">User</span></span>
            <a href="editor.html" class="btn btn-primary">+ New Project</a>
            <button class="btn btn-secondary" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h1>Dashboard</h1>
        <p class="welcome-text">Manage your Mi Band 9 projects</p>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📁</div>
                <div class="stat-value" id="totalProjects">-</div>
                <div class="stat-label">Total Projects</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-value" id="rpkProjects">-</div>
                <div class="stat-label">With RPK</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📄</div>
                <div class="stat-value" id="sourceProjects">-</div>
                <div class="stat-label">With Source</div>
            </div>
        </div>

        <h2 style="margin-bottom: 1rem;">Your Projects</h2>
        <div class="projects-grid" id="projectsList">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 1rem; color: var(--text-secondary);">Loading projects...</p>
            </div>
        </div>
    </div>

    <!-- Password Modal -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal">
            <h3 style="margin-bottom: 1rem;">Enter Password</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1rem;">Please enter your password to load your projects</p>
            <input type="password" id="modalPassword" class="form-input" placeholder="Password" style="width: 100%; padding: 0.75rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); margin-bottom: 1rem;">
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closePasswordModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitPassword()">Submit</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://rdfxvelaapi.share.zrok.io';
        let session = null;
        let currentPassword = null;

        // Check authentication on load
        document.addEventListener('DOMContentLoaded', () => {
            const sessionData = localStorage.getItem('velabuild_session');
            if (!sessionData) {
                window.location.href = 'index.html';
                return;
            }
            
            session = JSON.parse(sessionData);
            document.getElementById('username').textContent = session.username;
            
            // Use saved password if available, otherwise prompt
            if (session.password) {
                currentPassword = session.password;
                loadProjects();
            } else {
                showPasswordModal();
            }
        });

        async function apiRequest(endpoint, data) {
            const url = `${API_URL}${endpoint}`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                return await response.json();
            } catch (error) {
                return { success: false, error: 'Network error', log: error.message };
            }
        }

        function showPasswordModal() {
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('modalPassword').focus();
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
            if (!currentPassword) {
                // If no password and user cancels, go back to login
                window.location.href = 'index.html';
            }
        }

        async function submitPassword() {
            const password = document.getElementById('modalPassword').value;
            if (!password) {
                showToast('Please enter a password', 'error');
                return;
            }
            
            currentPassword = password;
            document.getElementById('passwordModal').classList.remove('active');
            document.getElementById('modalPassword').value = '';
            
            // Save password to session for this session
            session.password = password;
            localStorage.setItem('velabuild_session', JSON.stringify(session));
            
            loadProjects();
        }

        async function loadProjects() {
            const projectsList = document.getElementById('projectsList');
            projectsList.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 1rem; color: var(--text-secondary);">Loading projects...</p>
                </div>
            `;
            
            const result = await apiRequest('/list', {
                username: session.username,
                password: currentPassword
            });
            
            if (result.success && result.projects) {
                displayProjects(result.projects);
            } else {
                projectsList.innerHTML = `
                    <div style="text-align: center; padding: 3rem; grid-column: 1/-1;">
                        <p style="color: var(--error); margin-bottom: 1rem;">${result.error || 'Failed to load projects'}</p>
                        <button class="btn btn-primary" onclick="loadProjects()">Retry</button>
                    </div>
                `;
                
                // If authentication error, show password modal again
                if (result.error && result.error.includes('password')) {
                    currentPassword = null;
                    session.password = null;
                    localStorage.setItem('velabuild_session', JSON.stringify(session));
                    showPasswordModal();
                }
            }
        }

        function displayProjects(projects) {
            // Update stats
            document.getElementById('totalProjects').textContent = projects.length;
            document.getElementById('rpkProjects').textContent = projects.filter(p => p.hasRpk).length;
            document.getElementById('sourceProjects').textContent = projects.filter(p => p.hasSource).length;
            
            const projectsList = document.getElementById('projectsList');
            
            if (projects.length === 0) {
                projectsList.innerHTML = `
                    <div style="text-align: center; padding: 3rem; grid-column: 1/-1;">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
                        <h3>No Projects Yet</h3>
                        <p style="color: var(--text-secondary); margin-bottom: 1rem;">Create your first Mi Band 9 app</p>
                        <a href="editor.html" class="btn btn-primary">Create Project</a>
                    </div>
                `;
                return;
            }
            
            projectsList.innerHTML = projects.map(project => `
                <div class="project-card">
                    <div class="project-name">📁 ${project.name}</div>
                    <div class="project-info">
                        ${project.hasRpk ? '📦 RPK available' : 'No RPK'} · 
                        ${project.hasSource ? '📄 Source available' : 'No source'}
                    </div>
                    <div class="project-actions">
                        <a href="editor.html?project=${encodeURIComponent(project.name)}" class="btn btn-primary btn-sm">Open</a>
                        <a href="download.html?project=${encodeURIComponent(project.name)}" class="btn btn-secondary btn-sm">Download</a>
                    </div>
                </div>
            `).join('');
        }

        function handleLogout() {
            localStorage.removeItem('velabuild_session');
            window.location.href = 'index.html';
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
