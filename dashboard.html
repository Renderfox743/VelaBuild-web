<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VelaBuild - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">Vela<span>Build</span></a>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <span class="text-secondary">Welcome, <span id="username" style="color: var(--primary);">User</span></span>
            <a href="editor.html" class="btn btn-primary">New Project</a>
            <button class="btn btn-secondary" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Dashboard</h1>
        <p class="text-secondary mb-4">Manage your Mi Band 9 projects</p>

        <div class="grid grid-3 mb-4">
            <div class="card text-center">
                <div style="font-size: 2rem;">📁</div>
                <h3 id="projectCount">0</h3>
                <p class="text-secondary">Total Projects</p>
            </div>
            <div class="card text-center">
                <div style="font-size: 2rem;">📦</div>
                <h3 id="rpkCount">0</h3>
                <p class="text-secondary">Built Packages</p>
            </div>
            <div class="card text-center">
                <div style="font-size: 2rem;">⚡</div>
                <h3 id="buildCount">0</h3>
                <p class="text-secondary">Total Builds</p>
            </div>
        </div>

        <h2 class="mb-2">Recent Projects</h2>
        <div class="grid grid-3" id="recentProjects">
            <div class="card text-center text-secondary">
                Loading projects...
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
